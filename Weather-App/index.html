
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(black, grey);
            background: url("https://wallpapercave.com/wp/wp13151952.jpg");

            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
        }

        .card {
            width: 100%;
            max-width: 470px;
            background: url("https://wallpapercave.com/wp/wp13151952.jpg")
                        center / cover;

            border-radius: 20px;
            padding: 30px 25px;
            text-align: center;
            border: 2px solid black;
            box-shadow: inset 0 0 10px black, 0 0 10px black;
            color: white;
        }

        .search {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            
        }

        .search input {
            flex: 1;
            min-width: 0;
            border: 0;
            outline: 0;
            background: silver;
            color: black;
            border-radius: 20px;
            padding: 12px 15px;
            font-size: 15px;
        }

        .search button {
            height: 42px;
            width: 42px;
            flex-shrink: 0;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            background: silver;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .search button:disabled {
            cursor: wait;
            opacity: 0.6;
        }

        .search button img {
            height: 22px;
            width: 22px;
            object-fit: contain;
        }

        .weather-icon {
            width: 200px;
            height: 180px;
            object-fit: contain;
            margin-top: 15px;
        }

        .weather h1 {
            font-size: 50px;
            font-weight: 500;
        }

        .weather h2 {
            font-size: 30px;
            font-weight: 400;
            margin-top: 5px;
        }

        .details {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-top: 35px;
            align-items: center;
        }

        .col {
            display: flex;
            align-items: center;
            text-align: left;
            gap: 8px;
            min-width: 0;
        }

        .col img {
            width: 50px;
            height: 50px;
            object-fit: contain;
        }

        .col p {
            font-size: 13px;
        }

        .col .humidity,
        .col .wind {
            font-size: 18px;
            font-weight: bold;
            overflow-wrap: anywhere;
        }

        .message {
            margin-top: 15px;
            font-size: 14px;
            color: white;
        }

        @media (max-width: 360px) {
            .card {
                padding: 25px 15px;
            }

            .weather h1 {
                font-size: 40px;
            }

            .weather h2 {
                font-size: 25px;
            }

            .col img {
                width: 35px;
                height: 35px;
            }

            .col .humidity,
            .col .wind {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>
    <div class="card">

        <div class="search">
            <input
                type="text"
                placeholder="Enter City Name"
                spellcheck="false"
                aria-label="City name"
            >

            <button type="button" aria-label="Search weather">
                <img
                    src="https://cdn.iconscout.com/icon/premium/png-256-thumb/search-icon-svg-download-png-10754477.png?f=webp&w=128"
                    alt=""
                >
            </button>
        </div>

        <p class="message" role="status" aria-live="polite"></p>

        <div class="weather">
            <img
                class="weather-icon"
                src="https://static.vecteezy.com/system/resources/thumbnails/055/577/322/small/pixel-art-sun-radiating-bright-light-isolated-on-transparent-background-png.png"
                alt="Weather condition"
            >

            <h1 class="temp">--°C</h1>
            <h2 class="city">Search a city</h2>

            <div class="details">
                <div class="col">
                    <img
                        src="https://static.vecteezy.com/system/resources/thumbnails/065/420/865/small/realistic-water-drop-with-blue-gradient-shading-and-highlight-free-png.png"
                        alt=""
                    >

                    <div>
                        <p class="humidity">--%</p>
                        <p>Humidity</p>
                    </div>
                </div>

                <div class="col">
                    <img
                        src="https://static.vecteezy.com/system/resources/thumbnails/049/950/668/small/a-cartoon-tornado-with-a-black-background-png.png"
                        alt=""
                    >

                    <div>
                        <p class="wind">-- km/h</p>
                        <p>Wind speed</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const searchBox = document.querySelector(".search input");
        const searchBtn = document.querySelector(".search button");
        const message = document.querySelector(".message");

        const cityElement = document.querySelector(".city");
        const tempElement = document.querySelector(".temp");
        const humidityElement = document.querySelector(".humidity");
        const windElement = document.querySelector(".wind");
        const weatherIcon = document.querySelector(".weather-icon");

        async function checkWeather(city) {
            message.textContent = "Loading weather...";
            searchBtn.disabled = true;

            try {
                const response = await fetch(
                    `https://weather-api-proxy.paweethera.workers.dev/weather?city=${encodeURIComponent(city)}`
                );

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(
                        data.message || "Unable to fetch weather."
                    );
                }

                // Update weather information.
                cityElement.textContent = data.name;

                tempElement.textContent =
                    `${Math.round(data.main.temp)}°C`;

                humidityElement.textContent =
                    `${data.main.humidity}%`;

                windElement.textContent =
                    `${(data.wind.speed * 3.6).toFixed(1)} km/h`;

                // Update the icon for the current conditions.
                weatherIcon.src =
                    `https://openweathermap.org/img/wn/${data.weather[0].icon}@4x.png`;

                weatherIcon.alt = data.weather[0].description;

                message.textContent = data.weather[0].description;

            } catch (error) {
                message.textContent =
                    error.message === "Failed to fetch"
                        ? "Network error. Check your internet connection."
                        : error.message;

            } finally {
                searchBtn.disabled = false;
            }
        }

        // Search when the button is clicked.
        searchBtn.addEventListener("click", () => {
            const city = searchBox.value.trim();

            if (city) {
                checkWeather(city);
            } else {
                message.textContent = "Please enter a city name.";
            }
        });

        // Search when Enter is pressed.
        searchBox.addEventListener("keydown", (event) => {
            if (event.key === "Enter") {
                searchBtn.click();
            }
        });
    </script>
</body>
</html>
